; Filipino Homes settings, applied on top of php.ini-production.

; Don't advertise the PHP version in an X-Powered-By header.
expose_php = Off

; Image processing (Intervention Image, GD) on uploads of up to ~100 MB.
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 130M

; Code never changes inside a running container, so OPcache never rechecks files.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
