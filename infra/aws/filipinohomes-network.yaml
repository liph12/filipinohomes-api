AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Filipino Homes subnets inside shared-vpc (10.0.0.0/16): two private subnets in
  ap-southeast-1a and 1b, their route table (internet through the shared NAT gateway, the LR
  database through the shared peering connection), and an S3 gateway endpoint.

# Names follow the shared AWS naming scheme (NAMING.md, kept outside this repo for now).
#
# Deploy after shared-vpc-peering-default exists (preview first, then apply):
#   aws cloudformation deploy --region ap-southeast-1 --stack-name filipinohomes-network \
#     --template-file infra/aws/filipinohomes-network.yaml --tags Project=filipinohomes --no-execute-changeset
# On an existing stack, `deploy` keeps each parameter's previous value unless you pass
# --parameter-overrides, so changing a default here doesn't change the deployed value.
#
# Remove: delete filipinohomes-lr-db-access first, then
#   aws cloudformation delete-stack --region ap-southeast-1 --stack-name filipinohomes-network

Parameters:
  Name:
    Type: String
    Default: filipinohomes
    Description: The scope used in Name tags.
  SharedVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0ae2cdd0ef178e6de
    Description: shared-vpc (formerly homes-news-vpc).
  SharedNatGatewayId:
    Type: String
    Default: nat-04f5da1452c308bce
    Description: shared-nat-public1-ap-southeast-1a, the VPC's NAT gateway.
  PeeringExportName:
    Type: String
    Default: shared-vpc-peering-default-PeeringConnectionId
    Description: Export of the shared-vpc-peering-default stack.
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.160.0/22
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.164.0/22
  ZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-southeast-1a
  ZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-southeast-1b
  PeerVpcCidr:
    Type: String
    Default: 172.31.0.0/16
    Description: The default VPC, where the LR database runs.

Resources:
  # Private subnets for ECS instances and tasks. The ALB uses shared-vpc's public subnets,
  # which are in the same two zones.

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SharedVpcId
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Ref ZoneA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${Name}-subnet-private1-${ZoneA}"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SharedVpcId
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Ref ZoneB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${Name}-subnet-private2-${ZoneB}"

  # One route table for both subnets: there is a single NAT gateway either way.

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SharedVpcId
      Tags:
        - Key: Name
          Value: !Sub "${Name}-rtb-private"

  PrivateNatRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref SharedNatGatewayId

  PrivatePeeringRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: !Ref PeerVpcCidr
      VpcPeeringConnectionId:
        Fn::ImportValue: !Ref PeeringExportName

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Free S3 gateway endpoint: S3 and ECR image layers skip the NAT's per-GB fee.

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SharedVpcId
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable
      Tags:
        - Key: Name
          Value: !Sub "${Name}-vpce-s3"

Outputs:
  VpcId:
    Value: !Ref SharedVpcId
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
    Export:
      Name: !Sub "${AWS::StackName}-PrivateRouteTableId"
