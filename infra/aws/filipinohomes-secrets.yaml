AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Secrets Manager secret filipinohomes/api: the API's production settings (the server's .env, as
  JSON key/value pairs). ECS reads it when a task starts.

# Names follow the shared AWS naming scheme (NAMING.md, kept outside this repo for now).
#
# Deploy (preview first, then apply):
#   aws cloudformation deploy --region ap-southeast-1 --stack-name filipinohomes-secrets \
#     --template-file infra/aws/filipinohomes-secrets.yaml --tags Project=filipinohomes --no-execute-changeset
#
# The secret is created with no value, so no setting ever passes through this repo (it's public)
# or CloudFormation. Values are put straight into Secrets Manager with
# infra/aws/scripts/put-env-secret.py (or the console). Updating this stack never touches them.
#
# All settings live here, not only passwords, so internal ones (database host, bucket names,
# service URLs) stay out of the public templates. The ECS task definitions map each key by name.
#
# Kept if the stack is deleted (DeletionPolicy: Retain).

Resources:
  ApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: filipinohomes/api
      Description: Filipino Homes API production settings as JSON key/value pairs; ECS reads them at task start.
      Tags:
        - Key: Name
          Value: filipinohomes/api

Outputs:
  ApiSecretArn:
    Value: !Ref ApiSecret
    Export:
      Name: !Sub "${AWS::StackName}-ApiSecretArn"
