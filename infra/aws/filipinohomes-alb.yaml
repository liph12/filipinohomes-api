AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Filipino Homes load balancer in shared-vpc's public subnets: its security group, the
  internet-facing ALB, and the target group the web service registers its containers in
  (health check /up).

# Names follow the shared AWS naming scheme (NAMING.md, kept outside this repo for now).
#
# Deploy after filipinohomes-network exists (preview first, then apply):
#   aws cloudformation deploy --region ap-southeast-1 --stack-name filipinohomes-alb \
#     --template-file infra/aws/filipinohomes-alb.yaml --tags Project=filipinohomes --no-execute-changeset
# On an existing stack, pass --parameter-overrides to change a parameter's deployed value.
#
# HTTPS: while CertificateArn is empty, the ALB serves plain HTTP on port 80 only. To add HTTPS,
# get a certificate for api.filipinohomes.com into ACM in ap-southeast-1 (a public ACM certificate
# validated by a CNAME record in Cloudflare, or a Cloudflare origin certificate imported into ACM)
# and redeploy with CertificateArn=<arn>. HttpAction=redirect then sends port 80 to HTTPS. Keep it
# at forward while Cloudflare's SSL mode is Flexible (Cloudflare reaches the origin over HTTP), or
# every request redirects in a loop.
#
# The web service in filipinohomes-ecs-services registers containers in the target group. ECS on
# EC2 uses bridge networking with dynamic host ports, so targets are instances on ports
# 32768-65535 in the Filipino Homes private subnets.

Parameters:
  NetworkStackName:
    Type: String
    Default: filipinohomes-network
    Description: Stack that exports the VPC ID.
  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0fb4ea35deec52b73
    Description: shared-subnet-public1-ap-southeast-1a (10.0.0.0/20).
  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-04eb67fe8fd22bc34
    Description: shared-subnet-public2-ap-southeast-1b (10.0.16.0/20).
  TargetCidr:
    Type: String
    Default: 10.0.160.0/21
    Description: >-
      The Filipino Homes private subnets, where the ECS instances run. The ALB may only send
      traffic there.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for HTTPS on port 443. Empty serves HTTP only.
  HttpAction:
    Type: String
    Default: forward
    AllowedValues: [forward, redirect]
    Description: What port 80 does when there is a certificate. Without one it always forwards.
  IdleTimeoutSeconds:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 4000
    Description: >-
      Longer than Cloudflare's 100-second origin timeout, so Cloudflare, not the ALB, ends a slow
      request.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  RedirectHttp: !And
    - !Condition HasCertificate
    - !Equals [!Ref HttpAction, redirect]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: filipinohomes-sg-alb
      GroupDescription: Filipino Homes ALB - HTTP and HTTPS from the internet, out to the ECS instances
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      # Replaces the default allow-all egress rule.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          CidrIp: !Ref TargetCidr
          Description: Container dynamic host ports on the ECS instances
      Tags:
        - Key: Name
          Value: filipinohomes-sg-alb

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: filipinohomes-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: filipinohomes-alb

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: filipinohomes-tg-web
      TargetType: instance
      Protocol: HTTP
      ProtocolVersion: HTTP1
      # Each registered target brings its own dynamic host port; this one is only the default.
      Port: 8080
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      # Laravel's health route: 200 once the app boots. It doesn't touch the database, so a
      # database problem doesn't take every container out of service.
      HealthCheckProtocol: HTTP
      HealthCheckPath: /up
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: filipinohomes-tg-web

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - RedirectHttp
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref WebTargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: Point api.filipinohomes.com here (a proxied CNAME in Cloudflare) at cutover.
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDnsName"
  LoadBalancerFullName:
    Description: The LoadBalancer dimension of the ALB's CloudWatch metrics.
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerFullName"
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AlbSecurityGroupId"
  WebTargetGroupArn:
    Value: !Ref WebTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-WebTargetGroupArn"
